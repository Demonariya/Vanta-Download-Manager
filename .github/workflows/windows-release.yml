name: Windows CI & Release Pipeline

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Windows bundle target to build'
        type: choice
        default: 'all'
        options:
          - all
          - nsis
          - msi
          - portable
      clean_build:
        description: 'Run clean rebuild (-Clean)'
        type: boolean
        default: false
      create_github_release:
        description: 'Publish GitHub Release (requires tag matching manifest version)'
        type: boolean
        default: false
      release_tag:
        description: 'Release tag when create_github_release is enabled (e.g. v0.0.1)'
        type: string
        default: 'v0.0.1'
      upload_actions_artifacts:
        description: 'Upload downloadable Actions workflow artifacts'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'workflow_dispatch' }}

jobs:
  frontend-check:
    name: Frontend Lint, Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install FFmpeg and FFprobe for Integration Tests
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          FFMPEG_BIN="$(command -v ffmpeg)"
          FFPROBE_BIN="$(command -v ffprobe)"
          "$FFMPEG_BIN" -version | head -n 1
          "$FFPROBE_BIN" -version | head -n 1
          {
            echo "FFMPEG_PATH=$FFMPEG_BIN"
            echo "FFPROBE_PATH=$FFPROBE_BIN"
          } >> "$GITHUB_ENV"

      - name: Install Host-Compatible yt-dlp for Integration Tests
        run: |
          set -euo pipefail
          python3 --version
          VENV_DIR="${RUNNER_TEMP}/vanta-test-venv"
          python3 -m venv "$VENV_DIR"
          "$VENV_DIR/bin/python" -m pip install --upgrade pip
          "$VENV_DIR/bin/pip" install --upgrade yt-dlp
          YTDLP_BIN="$VENV_DIR/bin/yt-dlp"
          test -x "$YTDLP_BIN"
          YTDLP_VER="$("$YTDLP_BIN" --version)"
          echo "Installed yt-dlp $YTDLP_VER at $YTDLP_BIN"
          {
            echo "VANTA_TEST_YTDLP_PATH=$YTDLP_BIN"
            echo "TEST_YTDLP_VERSION=$YTDLP_VER"
          } >> "$GITHUB_ENV"

      - name: Install npm dependencies deterministically
        run: npm ci --include=optional

      - name: TypeScript typecheck
        run: npm run lint

      - name: Build Vite frontend bundle
        run: npm run build

      - name: Run frontend unit and integration tests
        run: npx --no-install tsx --test --test-concurrency=1 src/utils/*.test.ts

      - name: Publish Frontend Job Summary
        if: always()
        run: |
          {
            echo "### Frontend Lint, Build & Unit Tests"
            echo "- **Status**: \`${{ job.status }}\`"
            echo "- **Commit**: \`${{ github.sha }}\`"
            echo "- **Event**: \`${{ github.event_name }}\`"
            echo "- **Node.js**: \`$(node -v)\`"
            echo "- **yt-dlp**: \`${TEST_YTDLP_VERSION:-unavailable}\` (\`${VANTA_TEST_YTDLP_PATH:-unset}\`)"
            echo "- **FFmpeg**: \`${FFMPEG_PATH:-unset}\` | **FFprobe**: \`${FFPROBE_PATH:-unset}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  rust-check:
    name: Rust Format, Check, Tests & Lockfile Validation
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust Stable (MSVC x64)
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Cargo crates and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      - name: Run PowerShell Lockfile Validation Tests (Repo Root & External Dir)
        shell: pwsh
        run: |
          & .\scripts\Test-LockfileConsistency.ps1 -IncludeSubprocessTests

      - name: Verify Application Version Consistency Across Manifests & Lockfiles
        shell: pwsh
        run: |
          & .\scripts\Test-VersionConsistency.ps1

      - name: Verify Rust formatting
        # Existing Rust files include formatting drift; keep the check visible while allowing compile/tests to run.
        continue-on-error: true
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Check Rust crate compilation (--locked)
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml --features desktop

      - name: Run Rust unit tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features desktop

      - name: Publish Rust Validation Job Summary
        if: always()
        shell: pwsh
        run: |
          @(
            '### Rust Format, Check, Tests & Lockfile Validation'
            "- **Status**: ``${{ job.status }}``"
            "- **Commit**: ``${{ github.sha }}``"
            "- **Rustc**: ``$((rustc --version | Out-String).Trim())``"
            "- **Cargo**: ``$((cargo --version | Out-String).Trim())``"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

  windows-build:
    name: Build Windows x64 Installers & Portable Package
    needs: [frontend-check, rust-check]
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      release_requested: ${{ steps.build_flags.outputs.release_requested }}
      resolved_target: ${{ steps.build_flags.outputs.resolved_target }}
      app_version: ${{ steps.build_flags.outputs.app_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust Stable (MSVC x64)
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Cargo crates and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: './src-tauri -> target'

      - name: Determine Build & Release Parameters
        id: build_flags
        shell: pwsh
        run: |
          $isTag = "${{ startsWith(github.ref, 'refs/tags/v') }}" -eq 'True'
          $isPr = "${{ github.event_name }}" -eq 'pull_request'
          $dispatchRelease = ("${{ github.event_name }}" -eq 'workflow_dispatch') -and ("${{ inputs.create_github_release }}" -eq 'True')
          $releaseRequested = (-not $isPr) -and ($isTag -or $dispatchRelease)

          $target = if ("${{ github.event_name }}" -eq 'workflow_dispatch' -and "${{ inputs.build_target }}") {
            "${{ inputs.build_target }}"
          } else {
            'all'
          }
          if ($releaseRequested -and $target -ne 'all') {
            Write-Host "Release requested: overriding build_target '$target' to 'all' so release contains Setup, MSI, and Portable ZIP."
            $target = 'all'
          }

          $tauriConf = Get-Content -LiteralPath 'src-tauri/tauri.conf.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $appVer = [string]$tauriConf.version
          if ([string]::IsNullOrWhiteSpace($appVer)) {
            throw 'src-tauri/tauri.conf.json is missing application version.'
          }

          "release_requested=$($releaseRequested.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "resolved_target=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "app_version=$appVer" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run PowerShell Pre-Flight Diagnostic Checks
        shell: pwsh
        run: .\build.ps1 -Check

      - name: Build Windows Release via build.ps1
        shell: pwsh
        run: |
          $buildArgs = @('-Release', '-Target', '${{ steps.build_flags.outputs.resolved_target }}')
          if ("${{ github.event_name }}" -eq 'workflow_dispatch' -and "${{ inputs.clean_build }}" -eq 'True') {
            $buildArgs += '-Clean'
          }
          & .\build.ps1 @buildArgs

      - name: Verify Produced Deliverables, Archive Readability & Checksums
        shell: pwsh
        run: |
          $target = '${{ steps.build_flags.outputs.resolved_target }}'
          if (-not (Test-Path 'dist/SHA256SUMS.txt') -or -not (Test-Path 'dist/build-report.txt')) {
            throw 'Missing dist/SHA256SUMS.txt or dist/build-report.txt after build.'
          }
          if ($target -in @('all', 'nsis') -and -not (Get-ChildItem -Path 'dist' -Filter '*-setup.exe' | Where-Object { $_.Length -gt 0 })) {
            throw 'Missing non-empty NSIS setup executable in dist/.'
          }
          if ($target -in @('all', 'msi') -and -not (Get-ChildItem -Path 'dist' -Filter '*.msi' | Where-Object { $_.Length -gt 0 })) {
            throw 'Missing non-empty MSI installer in dist/.'
          }
          if ($target -in @('all', 'portable') -and -not (Get-ChildItem -Path 'dist' -Filter '*-portable.zip' | Where-Object { $_.Length -gt 0 })) {
            throw 'Missing non-empty Portable ZIP archive in dist/.'
          }
          Get-ChildItem -Path 'dist' -File | Format-Table Name, Length -AutoSize

      - name: Publish Failure Diagnostics to Job Summary
        if: failure() && hashFiles('last-build-failure.log') != ''
        shell: pwsh
        run: |
          @(
            '### Windows Build Failure Diagnostics'
            "- **Commit**: ``${{ github.sha }}``"
            "- **Event**: ``${{ github.event_name }}``"
            '```text'
            (Get-Content -Path 'last-build-failure.log' -Raw)
            '```'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Publish Windows Build Job Summary
        if: always()
        shell: pwsh
        run: |
          $nodeV = (node -v 2>$null | Out-String).Trim()
          $rustV = (rustc --version 2>$null | Out-String).Trim()
          $lines = @(
            '### VANTA Download Manager — Windows x64 Build Summary'
            "- **Application**: VANTA Download Manager"
            "- **Version**: ``${{ steps.build_flags.outputs.app_version }}``"
            "- **Commit**: ``${{ github.sha }}``"
            "- **Event**: ``${{ github.event_name }}``"
            "- **Node.js**: ``$nodeV``"
            "- **Rust**: ``$rustV``"
            "- **Frontend Validation**: ``${{ needs.frontend-check.result }}``"
            "- **Rust Validation**: ``${{ needs.rust-check.result }}``"
            "- **Windows Build Status**: ``${{ job.status }}``"
          )
          if (Test-Path 'dist/build-report.txt') {
            $lines += ''
            $lines += '#### Build Report'
            $lines += '```text'
            $lines += (Get-Content -Path 'dist/build-report.txt' -Raw).TrimEnd()
            $lines += '```'
          }
          if (Test-Path 'dist/SHA256SUMS.txt') {
            $lines += ''
            $lines += '#### SHA-256 Checksums'
            $lines += '```text'
            $lines += (Get-Content -Path 'dist/SHA256SUMS.txt' -Raw).TrimEnd()
            $lines += '```'
          }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload Failure Diagnostics Artifact
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VANTA-Failure-Diagnostics
          path: |
            last-build-failure.log
            dist/build-report.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Stage Internal Release Payload
        if: success() && steps.build_flags.outputs.release_requested == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vanta-release-payload
          path: |
            dist/*-setup.exe
            dist/*.msi
            dist/*-portable.zip
            dist/SHA256SUMS.txt
            dist/build-report.txt
          if-no-files-found: error
          retention-days: 1

      - name: Upload NSIS Setup Artifact
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.upload_actions_artifacts) && (steps.build_flags.outputs.resolved_target == 'all' || steps.build_flags.outputs.resolved_target == 'nsis')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VANTA-Windows-Setup-x64
          path: |
            dist/*-setup.exe
            dist/SHA256SUMS.txt
            dist/build-report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Enterprise MSI Artifact
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.upload_actions_artifacts) && (steps.build_flags.outputs.resolved_target == 'all' || steps.build_flags.outputs.resolved_target == 'msi')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VANTA-Windows-MSI-x64
          path: |
            dist/*.msi
            dist/SHA256SUMS.txt
            dist/build-report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Portable ZIP Artifact
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.upload_actions_artifacts) && (steps.build_flags.outputs.resolved_target == 'all' || steps.build_flags.outputs.resolved_target == 'portable')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VANTA-Windows-Portable-x64
          path: |
            dist/*-portable.zip
            dist/SHA256SUMS.txt
            dist/build-report.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Reports Artifact
        if: success() && (github.event_name != 'workflow_dispatch' || inputs.upload_actions_artifacts)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VANTA-Build-Reports
          path: |
            dist/SHA256SUMS.txt
            dist/build-report.txt
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: [windows-build]
    if: success() && needs.windows-build.outputs.release_requested == 'true' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Release Tag Against Manifest Version
        id: tag_check
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq 'workflow_dispatch') {
            "${{ inputs.release_tag }}"
          } else {
            "${{ github.ref_name }}"
          }
          $tag = $tag.Trim()
          if ([string]::IsNullOrWhiteSpace($tag)) {
            throw 'Release tag cannot be empty when publishing a GitHub Release.'
          }

          .\scripts\Test-VersionConsistency.ps1 -ReleaseTag $tag

          $isPrerelease = $tag.Contains('-')
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "prerelease=$($isPrerelease.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Download Verified Release Payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vanta-release-payload
          path: release-dist

      - name: Verify All Release Assets & SHA-256 Checksums
        run: |
          set -euo pipefail
          cd release-dist
          test -s SHA256SUMS.txt
          test -s build-report.txt
          find . -maxdepth 1 -name '*-setup.exe' -size +0c | grep -q .
          find . -maxdepth 1 -name '*.msi' -size +0c | grep -q .
          find . -maxdepth 1 -name '*-portable.zip' -size +0c | grep -q .
          sha256sum -c SHA256SUMS.txt
          ls -lh

      - name: Create or Update GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.tag_check.outputs.tag }}
          name: "VANTA Download Manager ${{ steps.tag_check.outputs.tag }}"
          body: |
            ## VANTA Download Manager — Windows x64 Release (${{ steps.tag_check.outputs.tag }})

            Application version **`${{ needs.windows-build.outputs.app_version }}`** for **Windows 10 / 11 (x64)** built with **Rust**, **Tauri 2**, and **React 19**.

            ### Release Assets
            - **NSIS Setup (`*-setup.exe`)**: Recommended per-machine Windows installer.
            - **Enterprise MSI (`*.msi`)**: Windows Installer package for managed deployments.
            - **Portable ZIP (`*-portable.zip`)**: Standalone executable archive (`VANTA.exe` + `Engine/` layout).
            - **`SHA256SUMS.txt`**: SHA-256 verification checksums for all assets.
            - **`build-report.txt`**: Exact toolchain versions and artifact sizes.

            ### Installation & Engine Architecture
            - VANTA uses **yt-dlp** (video/audio extraction & download) and **spotDL** (Spotify matching & tagging), with **FFmpeg/FFprobe** for media processing and muxing.
            - Slim installers manage external engines under `C:\Program Files\VANTA Download Manager\Engine` (`Engine\yt-dlp`, `Engine\spotdl`, `Engine\ffmpeg\bin`) or `%LOCALAPPDATA%\com.vanta.downloadmanager\engines\bin` and verify downloaded engine integrity via SHA-256.
            - User settings (`settings.v1.json`), download database (`vanta_native.db`), and cookies remain in `%LOCALAPPDATA%\com.vanta.downloadmanager` across upgrades/uninstalls.

            ### Checksum Verification (PowerShell)
            ```powershell
            Get-FileHash ".\VANTA Download Manager_${{ needs.windows-build.outputs.app_version }}_x64-setup.exe" -Algorithm SHA256
            Get-Content .\SHA256SUMS.txt
            ```

            ### Known Limitations
            - **Unsigned Windows Binaries**: Release executables and installers are not Authenticode code-signed; Windows SmartScreen may display an "Unknown Publisher" prompt until verified locally via `SHA256SUMS.txt`.
            - **Prior Internal `1.0.0` Builds**: Because public `0.0.1` is lower than internal `1.0.0`, Windows Installer prevents in-place downgrade over an existing `1.0.0` installation. Uninstall any `1.0.0` dev build first via Windows **Installed apps** before installing `0.0.1` (your settings, queue history, and cookies are preserved).
          files: |
            release-dist/*-setup.exe
            release-dist/*.msi
            release-dist/*-portable.zip
            release-dist/SHA256SUMS.txt
            release-dist/build-report.txt
          draft: false
          prerelease: ${{ steps.tag_check.outputs.prerelease == 'true' }}

      - name: Append Release URL & Summary
        run: |
          {
            echo "### Published GitHub Release"
            echo "- **Version**: ``${{ needs.windows-build.outputs.app_version }}``"
            echo "- **Tag**: ``${{ steps.tag_check.outputs.tag }}``"
            echo "- **Release URL**: ${{ steps.gh_release.outputs.url }}"
            echo "- **SHA-256 Verification**: Passed (``sha256sum -c SHA256SUMS.txt``)"
          } >> "$GITHUB_STEP_SUMMARY"
