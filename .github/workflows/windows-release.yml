name: Build & Release Windows Desktop App

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag Version (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      create_github_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Installer & Executable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Stable (MSVC x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Node Dependencies
        shell: pwsh
        run: |
          Write-Host "Installing dependencies natively for Windows (resolving platform-specific native bindings)..."
          # Fix for npm issue #4828: cross-platform lockfile causes missing optional native binaries on Windows
          if (Test-Path "package-lock.json") {
            Remove-Item -Force "package-lock.json"
          }
          npm install --include=optional

          Write-Host "Explicitly ensuring Windows Rolldown native binding is present..."
          npm install --no-save @rolldown/binding-win32-x64-msvc

      - name: Build Web Application
        run: npm run build

      - name: Bundle yt-dlp & FFmpeg for Windows
        shell: pwsh
        run: |
          Write-Host "Creating bin directory for Windows engine bundling..."
          New-Item -ItemType Directory -Force -Path src-tauri/bin

          Write-Host "Downloading latest yt-dlp.exe..."
          $ytDlpUrl = "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe"
          Invoke-WebRequest -Uri $ytDlpUrl -OutFile "src-tauri/bin/yt-dlp.exe" -UseBasicParsing

          Write-Host "Downloading verified FFmpeg Windows build..."
          $ffmpegUrl = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $ffmpegUrl -OutFile "ffmpeg.zip" -UseBasicParsing

          Write-Host "Extracting FFmpeg binaries..."
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted" -Force
          $ffmpegExe = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobeExe = Get-ChildItem -Path "ffmpeg_extracted" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1

          Copy-Item -Path $ffmpegExe.FullName -Destination "src-tauri/bin/ffmpeg.exe"
          Copy-Item -Path $ffprobeExe.FullName -Destination "src-tauri/bin/ffprobe.exe"

          Write-Host "Bundled Windows engines successfully:"
          Get-ChildItem -Path "src-tauri/bin"

      - name: Run Rust backend tests
        shell: pwsh
        run: cargo test --manifest-path src-tauri/Cargo.toml --features desktop

      - name: Build Tauri Desktop App (NSIS Installer & MSI)
        shell: pwsh
        run: |
          Write-Host "Building Tauri Windows App with MSVC..."
          npx tauri build --features desktop --target x86_64-pc-windows-msvc

      - name: Collect & Checksum Installer Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release_artifacts"

          # Search for generated setup .exe, .msi, and standalone .exe
          $nsisInstallers = Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue
          $msiInstallers = Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi" -Filter "*.msi" -ErrorAction SilentlyContinue
          $mainExe = Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release" -Filter "vanta.exe" -ErrorAction SilentlyContinue

          if ($nsisInstallers) {
            Copy-Item -Path $nsisInstallers[0].FullName -Destination "release_artifacts/VANTA-Download-Manager-Setup-x64.exe" -Force
          }
          if ($msiInstallers) {
            Copy-Item -Path $msiInstallers[0].FullName -Destination "release_artifacts/VANTA-Download-Manager-x64.msi" -Force
          }

          # Create a standalone zip including portable executable and bundled engines
          if ($mainExe) {
            New-Item -ItemType Directory -Force -Path "portable_package"
            Copy-Item -Path $mainExe.FullName -Destination "portable_package/VANTA.exe"
            Copy-Item -Path "src-tauri/bin/*" -Destination "portable_package/" -Recurse
            Compress-Archive -Path "portable_package/*" -DestinationPath "release_artifacts/VANTA-Download-Manager-Portable-x64.zip" -Force
          }

          Write-Host "Generated release artifacts:"
          Get-ChildItem -Path "release_artifacts"

          # Generate SHA256 checksums for all binary artifacts
          Get-FileHash -Algorithm SHA256 (Get-ChildItem "release_artifacts" -Exclude "SHA256SUMS.txt") |
            ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } |
            Out-File -FilePath "release_artifacts/SHA256SUMS.txt" -Encoding ascii
          Get-Content "release_artifacts/SHA256SUMS.txt"

      - name: Upload Artifacts to GitHub Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: VANTA-Windows-Installer-x64
          path: release_artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_github_release == 'true')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "VANTA Download Manager ${{ github.event.inputs.release_tag || github.ref_name }}"
          body: |
            ## VANTA Download Manager — Production Windows Release
            
            Premium high-concurrency desktop video & music workstation powered by **yt-dlp**, **spotDL**, **FFmpeg**, and **Rust / Tauri 2**.

            ### 📦 Included Files:
            - **`VANTA-Download-Manager-Setup-x64.exe`**: Standard NSIS Windows Installer (Recommended for Windows 10 & 11).
            - **`VANTA-Download-Manager-x64.msi`**: Windows Enterprise MSI Installer.
            - **`VANTA-Download-Manager-Portable-x64.zip`**: Portable standalone release with bundled engines.
            - **`SHA256SUMS.txt`**: Cryptographic integrity checksums.

            ### ✨ Key Features:
            - Native 64-bit performance with MSVC and multi-threaded Tokio queue.
            - Custom Title Bar with native Tauri 2 minimize, maximize, and safe close confirmation.
            - True Audio Quality system: FLAC 16/24-bit, WAV PCM up to 192 kHz, transparent transcode disclosure.
            - Post-download FFprobe audio stream verification.
            - Built-in `yt-dlp` and `FFmpeg` engines bundled.
            - Spotify music downloading & tagging with metadata preservation.
            - Dynamic stream format inspector & video/audio muxing.
          files: release_artifacts/*
          draft: false
          prerelease: false
