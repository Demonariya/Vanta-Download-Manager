name: Build & Release Windows Desktop App

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag Version (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      create_github_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: true
      upload_actions_artifacts:
        description: 'Upload downloadable GitHub Actions workflow artifacts'
        type: boolean
        default: true
      upload_msi_artifact:
        description: 'Upload MSI installer as separate Actions artifact'
        type: boolean
        default: true
      upload_portable_artifact:
        description: 'Upload Portable ZIP as separate Actions artifact'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  build-windows:
    name: Build Windows x64 Installer & Executable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup Rust Stable (MSVC x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Build Windows Release via build.ps1
        shell: pwsh
        run: .\build.ps1 -Release -Target all

      - name: Publish Build Report to Job Summary
        if: always() && hashFiles('dist/build-report.txt') != ''
        shell: pwsh
        run: |
          @(
            '### Windows x64 Release Build Report'
            '```text'
            (Get-Content -Path 'dist/build-report.txt' -Raw)
            '```'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Prune Previous Workflow Artifacts in Repository
        if: github.event_name != 'workflow_dispatch' || inputs.upload_actions_artifacts
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization          = "Bearer $env:GITHUB_TOKEN"
            Accept                 = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $repo = "${{ github.repository }}"
          $currentRunId = [long]"${{ github.run_id }}"
          $freedBytes = [long]0
          $deletedCount = 0

          try {
            $page = 1
            do {
              $listUrl = "https://api.github.com/repos/$repo/actions/artifacts?per_page=100&page=$page"
              $resp = Invoke-RestMethod -Uri $listUrl -Headers $headers -Method Get
              $artifacts = $resp.artifacts
              if (-not $artifacts -or $artifacts.Count -eq 0) { break }

              foreach ($art in $artifacts) {
                if ($art.expired) { continue }
                if ($art.workflow_run -and ([long]$art.workflow_run.id -eq $currentRunId)) { continue }
                try {
                  $delUrl = "https://api.github.com/repos/$repo/actions/artifacts/$($art.id)"
                  Invoke-RestMethod -Uri $delUrl -Headers $headers -Method Delete | Out-Null
                  $freedBytes += [long]$art.size_in_bytes
                  $deletedCount++
                  Write-Host "Deleted old artifact '$($art.name)' ($($art.size_in_bytes) bytes) from run $($art.workflow_run.id)"
                } catch {
                  Write-Warning "Could not delete artifact $($art.id) ($($art.name)): $_"
                }
              }
              $page++
            } while ($artifacts.Count -eq 100)

            $freedMiB = [Math]::Round($freedBytes / 1MB, 2)
            Write-Host "Pruned $deletedCount old artifact(s) in $repo, freeing $freedMiB MiB."
          } catch {
            Write-Warning "Failed listing/pruning repository artifacts: $_"
          }

      - name: Upload Recommended NSIS Setup Artifact
        id: upload_setup
        if: github.event_name != 'workflow_dispatch' || inputs.upload_actions_artifacts
        continue-on-error: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_github_release)) }}
        uses: actions/upload-artifact@v7
        with:
          name: VANTA-Windows-Setup-x64
          path: |
            dist/*-setup.exe
            dist/SHA256SUMS.txt
            dist/build-report.txt
          if-no-files-found: error
          retention-days: 5

      - name: Upload Enterprise MSI Artifact
        id: upload_msi
        if: (github.event_name != 'workflow_dispatch' || (inputs.upload_actions_artifacts && inputs.upload_msi_artifact)) && steps.upload_setup.outcome != 'failure'
        continue-on-error: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_github_release)) }}
        uses: actions/upload-artifact@v7
        with:
          name: VANTA-Windows-MSI-x64
          path: |
            dist/*.msi
            dist/SHA256SUMS.txt
            dist/build-report.txt
          if-no-files-found: error
          retention-days: 5

      - name: Upload Portable ZIP Artifact
        id: upload_portable
        if: (github.event_name != 'workflow_dispatch' || (inputs.upload_actions_artifacts && inputs.upload_portable_artifact)) && steps.upload_setup.outcome != 'failure'
        continue-on-error: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_github_release)) }}
        uses: actions/upload-artifact@v7
        with:
          name: VANTA-Windows-Portable-x64
          path: |
            dist/*-portable.zip
            dist/SHA256SUMS.txt
            dist/build-report.txt
          if-no-files-found: error
          retention-days: 5

      - name: Report Artifact Storage Quota Notice if Skipped
        if: steps.upload_setup.outcome == 'failure' || steps.upload_msi.outcome == 'failure' || steps.upload_portable.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Warning "GitHub Actions account artifact storage quota is full. Proceeding with GitHub Release upload, which does not count against Actions artifact quota."
          @(
            '### GitHub Actions Artifact Storage Quota Full'
            '- Actions artifact upload was skipped because account-wide Actions/Packages storage hit its quota across repositories under this owner.'
            '- Installers, SHA256SUMS.txt, and build-report.txt remain attached to the GitHub Release when release creation is enabled.'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Create or Update GitHub Release
        if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_github_release))
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: "VANTA Download Manager ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          body: |
            ## VANTA Download Manager — Production Windows Release

            High-concurrency desktop video & music workstation powered by **Rust / Tauri 2**, **yt-dlp**, **spotDL**, and **FFmpeg**.

            ### Included Release Assets
            - **NSIS Setup (`*-setup.exe`)**: Recommended Windows installer (Windows 10 & 11 x64).
            - **Enterprise MSI (`*.msi`)**: Windows Installer package for managed deployments.
            - **Portable ZIP (`*-portable.zip`)**: Standalone executable archive.
            - **`SHA256SUMS.txt`**: Cryptographic SHA-256 verification checksums.
            - **`build-report.txt`**: Toolchain, version, and artifact size manifest.

            ### Managed Runtime Architecture
            - Slim installers exclude bulky external CLI binaries (~300+ MiB).
            - On first launch (or from **Diagnostics**), VANTA downloads and **SHA-256 verifies** `yt-dlp`, `FFmpeg`/`FFprobe`, and `spotDL` into `%LOCALAPPDATA%\com.vanta.downloadmanager\engines\bin` (or loads side-by-side `bin/` binaries in portable mode).
          files: |
            dist/*-setup.exe
            dist/*.msi
            dist/*-portable.zip
            dist/SHA256SUMS.txt
            dist/build-report.txt
          draft: false
          prerelease: false
